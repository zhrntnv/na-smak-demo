<meta property="og:description" content="Демонстраційний сайт. Замовлення — через Bolt Food.">
<meta property="og:type" content="website">

<style>
:root{--bg:#161412;--bg2:#1f1c19;--cream:#f6efe3;--ink:#161412;--chili:#e2511f;--chili-d:#b83d14;--mut:#a39b90;--line:#38332e;color-scheme:dark;
--fd:'Unbounded','Arial Black',sans-serif;--fb:'Onest',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{max-width:100%;overflow-x:clip}
.hero .wrap>*{min-width:0}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--cream);font:400 17px/1.55 var(--fb);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--chili);outline-offset:3px;border-radius:4px}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(22,20,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.logo{max-width:340px;font:800 14px/1.15 var(--fd);text-decoration:none;letter-spacing:-.01em;margin-right:auto}
.logo small{display:block;font:500 11px var(--fb);color:var(--mut);margin-top:3px}
nav{display:flex;gap:26px}
nav a{text-decoration:none;font-weight:500;color:var(--cream);opacity:.85}
nav a:hover{opacity:1;color:var(--chili)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{font:600 13px var(--fb);background:none;border:0;color:var(--mut);padding:6px 12px;border-radius:99px;cursor:pointer;min-height:32px}
.lang button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:99px;background:var(--chili);color:#fff;font:600 16px var(--fb);text-decoration:none;border:2px solid var(--chili);transition:background .2s,transform .2s;cursor:pointer}
.btn:hover{background:var(--chili-d);border-color:var(--chili-d)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;border-color:var(--cream);color:var(--cream)}
.btn.ghost:hover{background:var(--cream);color:var(--ink)}
.btn.sm{min-height:42px;padding:0 20px;font-size:15px}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--cream);width:44px;height:44px;border-radius:12px;cursor:pointer}
.burger svg{display:block;margin:auto}
.hero{padding:clamp(48px,9vw,120px) 0 clamp(48px,8vw,100px);border-bottom:1px solid var(--line)}
h1{font:800 3.6vw/1.02 var(--fd);letter-spacing:-.035em;margin:0 0 28px;overflow-wrap:normal;word-break:normal;hyphens:none}
@media(min-width:1500px){h1{font-size:52px}}
h1 em{font-style:normal;color:var(--chili)}
.hero p{max-width:34em;font-size:clamp(17px,2vw,21px);color:#d8d0c4;margin:0 0 34px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
section{padding:clamp(56px,8vw,110px) 0}
h2{font:800 clamp(28px,5vw,60px)/1.05 var(--fd);letter-spacing:-.03em;margin:0 0 36px}
.cream{background:var(--cream);color:var(--ink)}
.cream .mut{color:#5d564d}
.mut{color:var(--mut)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.filters button{font:500 15px var(--fb);min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid #bdb3a3;background:none;color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/5;background:#e6ddcd;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.card .bd{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font:600 18px/1.25 var(--fb)}
.card .pr{font:800 18px var(--fd);color:var(--chili-d);margin-top:auto}
.pop{align-self:flex-start;background:#f5a800;color:#161412;font:600 12px var(--fb);padding:3px 9px;border-radius:6px}
.snap{margin:28px 0 0;font-size:14px;max-width:46em}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.hero figure{margin:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:var(--bg2)}
.hero figure img{width:100%;height:100%;object-fit:cover;display:block}
.empty{border:2px dashed #b7ac99;border-radius:20px;padding:clamp(24px,5vw,56px);max-width:760px}
.empty h3{font:600 clamp(20px,3vw,26px)/1.2 var(--fb);margin:0 0 12px}
.empty p{margin:0 0 22px;max-width:38em}
.empty.dk{border-color:var(--line)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gal figure{margin:0;overflow:hidden;border-radius:14px;aspect-ratio:4/5}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.loc{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(24px,5vw,64px);align-items:start}
.mapbox{aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.mapcard{height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px;padding:clamp(24px,5vw,48px)}.mapcard p{margin:0;max-width:26em;color:#d8d0c4}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.final{background:var(--chili);color:#fff;text-align:left}
.final h2{max-width:14em}
.final .btn{background:var(--ink);border-color:var(--ink)}
.final .btn:hover{background:#000}
footer{padding:48px 0 56px;border-top:1px solid var(--line)}
.fgrid{display:flex;flex-wrap:wrap;gap:28px 48px;justify-content:space-between;margin-bottom:32px}
.fgrid ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 24px}
.fgrid a{text-decoration:none;color:#d8d0c4}.fgrid a:hover{color:var(--chili)}
.disc{font-size:14px;color:var(--mut);max-width:62em;margin:0;line-height:1.6}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media(max-width:900px){
 .hero .wrap{grid-template-columns:1fr}
 h1{font-size:min(7vw,64px)}.hero figure{order:-1;aspect-ratio:4/3}
 nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:8px 20px 16px;display:none}
 nav.open{display:flex}
 nav a{padding:14px 0;font-size:18px;border-bottom:1px solid var(--line)}
 .burger{display:block}
 .loc{grid-template-columns:1fr}
 .gal{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media(max-width:560px){
 .bar{gap:8px}.logo small{display:none}
 .logo{flex:1 1 0;min-width:0;max-width:none;font-size:12.5px}.lang button{padding:6px 9px}.burger{flex:none}
 .hdr-order{display:none}
 .btn{width:100%}.cta .btn{flex:1 1 100%}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.rv{opacity:1;transform:none}}
@media(prefers-color-scheme:light){:root{color-scheme:dark}}
</style>

let lang="uk",cat="all";
try{const s=localStorage.getItem("lang");if(s==="ru"||s==="uk")lang=s}catch(e){}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
 const t=T[lang];
 document.documentElement.lang=lang;document.title=t.title;
 $('meta[name=description]').content=t.d;$('meta[property="og:title"]').content=t.title;$('meta[property="og:description"]').content=t.d;
 $$('[data-i]').forEach(e=>{const v=t[e.dataset.i];if(v!=null)e.hasAttribute('data-html')?e.innerHTML=v:e.textContent=v});
 $$('[data-order]').forEach(a=>a.href=BOLT);$$('[data-map]').forEach(a=>a.href=MAPS);
 $$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 /* menu */
 const has=MENU.some(c=>c.items&&c.items.length);
 $('#menuEmpty').hidden=has;$('#menuGrid').hidden=!has;
 const f=$('#filters');f.hidden=!has||MENU.length<2;
 if(has){
  f.innerHTML=[{id:"all",name:{uk:t.all,ru:t.all}},...MENU].map(c=>`<button data-c="${esc(c.id)}" aria-pressed="${c.id===cat}">${esc(c.name[lang])}</button>`).join("");
  $('#menuGrid').innerHTML=MENU.filter(c=>cat==="all"||c.id===cat).flatMap(c=>c.items).map(i=>`<article class="card">${i.img?`<div class="ph"><img src="${esc(IMG[i.img]||i.img)}" alt="${esc(i.name)}" loading="lazy" decoding="async" onerror="this.closest('.ph').remove()"></div>`:""}<div class="bd">${i.pop?`<span class="pop">${esc(t.pop)}</span>`:""}<h3>${esc(i.name)}</h3>${i.desc&&i.desc[lang]?`<p class="mut" style="margin:0;font-size:15px">${esc(i.desc[lang])}</p>`:""}${i.price!=null?`<div class="pr">${esc(i.price)} ${esc(i.currency||"")}</div>`:""}</div></article>`).join("");
 }
 /* gallery */
 $('#galEmpty').hidden=GALLERY.length>0;
 $('#galGrid').innerHTML=GALLERY.map(g=>`<figure><img src="${esc(g.src)}" alt="${esc(g.alt[lang])}" loading="lazy" decoding="async"></figure>`).join("");
 /* map */
 $('#heroImg').src=IMG.g1;$('#heroImg').alt=GALLERY[0].alt[lang];
 const mb=$('#mapBox');
 if(MAP_EMBED_URL&&ALLOW_EMBED){if(!mb.firstElementChild||mb.firstElementChild.tagName!=="IFRAME")mb.innerHTML=`<iframe src="${esc(MAP_EMBED_URL)}" title="Google Maps — Шаурма «На смак та аромат»" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`}
 else{mb.innerHTML=`<div class="mapcard"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--chili)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><p>${esc(t.mapNote)}</p><a class="btn" href="${DIR_URL}" target="_blank" rel="noopener noreferrer">${esc(t.dir)}</a></div>`}
}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem("lang",lang)}catch(_){}render();return}
 const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render();return}
 if(e.target.closest('nav a'))closeNav();
});
const nav=$('#nav'),bg=$('#burger');
function closeNav(){nav.classList.remove('open');bg.setAttribute('aria-expanded','false')}
bg.addEventListener('click',()=>{const o=nav.classList.toggle('open');bg.setAttribute('aria-expanded',o)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});
render();
</script>
